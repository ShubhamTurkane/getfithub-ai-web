<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Fitness Plan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forest: { 950: '#010f06', 900: '#021a0b', 800: '#042d14', 700: '#065c25', 600: '#097a30', 500: '#0d9f40' },
            lime: { 400: '#a3e635', 300: '#bef264', 200: '#d9f99d' },
            ash: { 400: '#9ca3af', 300: '#d1d5db', 200: '#e5e7eb' }
          },
          fontFamily: {
            display: ['Bebas Neue', 'sans-serif'],
            body: ['DM Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          keyframes: {
            fadeUp: { '0%': { opacity: '0', transform: 'translateY(28px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            pulseGlow: { '0%,100%': { boxShadow: '0 0 0 0 rgba(163,230,53,0)' }, '50%': { boxShadow: '0 0 24px 4px rgba(163,230,53,0.18)' } },
            spin: { to: { transform: 'rotate(360deg)' } },
            ticker: { '0%': { width: '0%' }, '100%': { width: '100%' } },
          },
          animation: {
            fadeUp: 'fadeUp 0.55s ease both',
            pulseGlow: 'pulseGlow 2.4s ease-in-out infinite',
            spin: 'spin 0.9s linear infinite',
            ticker: 'ticker 2.2s ease forwards',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #010f06; }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    .card-glow { box-shadow: 0 0 0 1px rgba(163,230,53,0.08), 0 4px 32px rgba(0,0,0,0.6); }
    .card-glow:hover { box-shadow: 0 0 0 1px rgba(163,230,53,0.18), 0 8px 40px rgba(0,0,0,0.7); }

    .stat-ring { background: conic-gradient(#a3e635 var(--pct), #042d14 0); }

    .grid-line {
      background-image: linear-gradient(rgba(9,122,48,0.07) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(9,122,48,0.07) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .delay-1 { animation-delay: 0.08s }
    .delay-2 { animation-delay: 0.16s }
    .delay-3 { animation-delay: 0.24s }
    .delay-4 { animation-delay: 0.32s }
    .delay-5 { animation-delay: 0.40s }

    table thead th { background-color: rgba(4,45,20,0.9); }
    table tbody tr:nth-child(even) td { background-color: rgba(6,92,37,0.07); }
    table tbody tr:hover td { background-color: rgba(163,230,53,0.05); }

    @media print {
      body::before { display: none; }
      .no-print { display: none !important; }
      .card-glow { box-shadow: none; border: 1px solid #ddd; }
      body { background: white; color: #111; }
      .text-lime-400, .text-lime-300 { color: #166534 !important; }
      .text-ash-300, .text-ash-400 { color: #374151 !important; }
      .bg-forest-900, .bg-forest-800, .bg-forest-950 { background: white !important; }
      th { background-color: #f0fdf4 !important; color: #166534 !important; }
    }
  </style>
</head>
<body class="font-body text-ash-300 min-h-screen grid-line relative">

  <!-- LOADING STATE -->
  <div id="loadingScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-forest-950">
    <div class="relative mb-8">
      <div class="w-20 h-20 rounded-full border-4 border-forest-700 border-t-lime-400 animate-spin"></div>
      <div class="absolute inset-0 flex items-center justify-center">
        <svg class="w-7 h-7 text-lime-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
    </div>
    <p class="font-display text-3xl text-lime-400 tracking-widest mb-2">BUILDING YOUR PLAN</p>
    <p id="loadingMsg" class="font-mono text-sm text-forest-500 tracking-wide">Analyzing your profile…</p>
  </div>

  <!-- MAIN CONTENT (hidden until ready) -->
  <div id="mainContent" class="hidden relative z-10">

    <!-- HEADER -->
    <header class="no-print sticky top-0 z-40 border-b border-forest-800 bg-forest-950/90 backdrop-blur-sm">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-md bg-lime-400 flex items-center justify-center">
            <svg class="w-4 h-4 text-forest-950" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </div>
          <span class="font-display text-xl tracking-widest text-lime-400">FITFORGE</span>
        </div>
        <div class="flex gap-2">
          <button onclick="window.print()" class="flex items-center gap-2 px-4 py-2 rounded-lg border border-forest-700 hover:border-lime-400/40 text-ash-400 hover:text-lime-400 text-sm font-mono transition-all duration-200">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
            Print
          </button>
          <button onclick="startOver()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-lime-400 hover:bg-lime-300 text-forest-950 text-sm font-mono font-semibold transition-all duration-200">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Start Over
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10 space-y-8">

      <!-- HERO greeting -->
      <div class="animate-fadeUp">
        <p class="font-mono text-lime-400 text-sm tracking-widest mb-1">// YOUR PERSONALIZED PLAN</p>
        <h1 class="font-display text-5xl md:text-7xl text-ash-200 tracking-wider leading-none" id="heroName">READY TO CRUSH IT</h1>
        <p class="mt-2 text-ash-400 text-sm font-mono" id="heroMeta"></p>
      </div>

      <!-- BMI + BMR CARDS -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- BMI Card -->
        <div class="animate-fadeUp delay-1 bg-forest-900 border border-forest-800 rounded-2xl p-6 card-glow transition-all duration-300">
          <div class="flex items-start justify-between mb-4">
            <div>
              <p class="font-mono text-xs text-forest-500 uppercase tracking-widest">Body Mass Index</p>
              <p class="font-display text-5xl text-ash-200 mt-1" id="bmiValue">—</p>
            </div>
            <div class="w-16 h-16 rounded-xl bg-forest-800 flex items-center justify-center animate-pulseGlow">
              <svg class="w-7 h-7 text-lime-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            </div>
          </div>
          <div class="mb-3">
            <div class="flex justify-between text-xs font-mono mb-1">
              <span class="text-blue-400">Under</span><span class="text-lime-400">Normal</span><span class="text-yellow-400">Over</span><span class="text-red-400">Obese</span>
            </div>
            <div class="relative h-2 rounded-full bg-forest-800 overflow-hidden">
              <div class="h-full rounded-full bg-gradient-to-r from-blue-500 via-lime-400 via-yellow-400 to-red-500"></div>
              <div id="bmiMarker" class="absolute top-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-white border-2 border-forest-950 transition-all duration-700" style="left:42%"></div>
            </div>
          </div>
          <p class="font-mono text-lime-400 text-sm font-semibold" id="bmiCategory">—</p>
          <p class="text-ash-400 text-xs mt-1" id="bmiNote">—</p>
        </div>

        <!-- BMR Card -->
        <div class="animate-fadeUp delay-2 bg-forest-900 border border-forest-800 rounded-2xl p-6 card-glow transition-all duration-300">
          <div class="flex items-start justify-between mb-4">
            <div>
              <p class="font-mono text-xs text-forest-500 uppercase tracking-widest">Basal Metabolic Rate</p>
              <p class="font-display text-5xl text-ash-200 mt-1"><span id="bmrValue">—</span><span class="text-xl text-forest-500 ml-1">kcal/day</span></p>
            </div>
            <div class="w-16 h-16 rounded-xl bg-forest-800 flex items-center justify-center animate-pulseGlow">
              <svg class="w-7 h-7 text-lime-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/></svg>
            </div>
          </div>
          <div class="space-y-2">
            <div id="tdeeRows" class="space-y-2"></div>
          </div>
          <p class="text-ash-400 text-xs mt-3 font-mono" id="bmrNote">—</p>
        </div>
      </div>

      <!-- STATS ROW -->
      <div class="animate-fadeUp delay-3 grid grid-cols-2 md:grid-cols-4 gap-3">
        <!-- stat cards filled dynamically -->
      </div>

      <!-- 7-DAY DIET PLAN -->
      <div class="animate-fadeUp delay-3">
        <div class="flex items-center gap-3 mb-4">
          <div class="h-px flex-1 bg-forest-800"></div>
          <p class="font-display text-2xl text-lime-400 tracking-widest">7-DAY DIET PLAN</p>
          <div class="h-px flex-1 bg-forest-800"></div>
        </div>
        <div class="bg-forest-900 border border-forest-800 rounded-2xl overflow-hidden card-glow">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr>
                  <th class="px-4 py-3 text-left font-mono text-xs text-lime-400 uppercase tracking-widest border-b border-forest-800">Day</th>
                  <th class="px-4 py-3 text-left font-mono text-xs text-ash-400 uppercase tracking-widest border-b border-forest-800">Breakfast</th>
                  <th class="px-4 py-3 text-left font-mono text-xs text-ash-400 uppercase tracking-widest border-b border-forest-800">Lunch</th>
                  <th class="px-4 py-3 text-left font-mono text-xs text-ash-400 uppercase tracking-widest border-b border-forest-800">Dinner</th>
                  <th class="px-4 py-3 text-left font-mono text-xs text-ash-400 uppercase tracking-widest border-b border-forest-800">Snacks</th>
                </tr>
              </thead>
              <tbody id="dietTableBody" class="divide-y divide-forest-800/50"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- WORKOUT PLAN -->
      <div class="animate-fadeUp delay-4">
        <div class="flex items-center gap-3 mb-4">
          <div class="h-px flex-1 bg-forest-800"></div>
          <p class="font-display text-2xl text-lime-400 tracking-widest">WORKOUT PLAN</p>
          <div class="h-px flex-1 bg-forest-800"></div>
        </div>
        <div id="workoutGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
      </div>

      <!-- BOTTOM BUTTONS (print) -->
      <div class="no-print animate-fadeUp delay-5 flex flex-col sm:flex-row gap-3 pt-4 pb-10">
        <button onclick="window.print()" class="flex-1 flex items-center justify-center gap-2 py-4 rounded-xl border border-forest-700 hover:border-lime-400/40 text-ash-300 hover:text-lime-400 font-mono text-sm transition-all duration-200">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          Print / Save PDF
        </button>
        <button onclick="startOver()" class="flex-1 flex items-center justify-center gap-2 py-4 rounded-xl bg-lime-400 hover:bg-lime-300 text-forest-950 font-mono font-semibold text-sm transition-all duration-200">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          Start Over — New Plan
        </button>
      </div>

    </main>
  </div>

  <script>
    // ─── DEMO SEED: pre-fill localStorage so the page works standalone ──────────
    if (!localStorage.getItem('fitforge_user')) {
      localStorage.setItem('fitforge_user', JSON.stringify({
        name: 'Alex Rivera',
        age: 28,
        gender: 'male',
        weightKg: 82,
        heightCm: 178,
        activityLevel: 'moderate',
        goal: 'lose fat & build muscle',
        dietPreference: 'non-vegetarian'
      }));
    }

    // ─── LOADING MESSAGES ─────────────────────────────────────────────────────
    const loadingMessages = [
      'Analyzing your profile…',
      'Calculating metabolism…',
      'Designing your diet plan…',
      'Crafting your workout split…',
      'Almost there…',
    ];
    let msgIdx = 0;
    const msgEl = document.getElementById('loadingMsg');
    const msgTimer = setInterval(() => {
      msgIdx = (msgIdx + 1) % loadingMessages.length;
      msgEl.textContent = loadingMessages[msgIdx];
    }, 1800);

    // ─── READ USER DATA ───────────────────────────────────────────────────────
    function readUserData() {
      try {
        const raw = localStorage.getItem('fitforge_user');
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    }

    // ─── MIFFLIN-ST JEOR BMR ─────────────────────────────────────────────────
    function calcBMR(u) {
      const base = (10 * u.weightKg) + (6.25 * u.heightCm) - (5 * u.age);
      return u.gender === 'female' ? base - 161 : base + 5;
    }

    function calcBMI(u) {
      const h = u.heightCm / 100;
      return +(u.weightKg / (h * h)).toFixed(1);
    }

    function bmiInfo(bmi) {
      if (bmi < 18.5) return { cat: 'Underweight', note: 'Focus on caloric surplus + strength training.', pct: (bmi / 40) * 100, col: '#60a5fa' };
      if (bmi < 25)   return { cat: 'Normal Weight', note: 'Excellent range. Maintain with balanced nutrition.', pct: (bmi / 40) * 100, col: '#a3e635' };
      if (bmi < 30)   return { cat: 'Overweight', note: 'Moderate deficit + cardio recommended.', pct: (bmi / 40) * 100, col: '#facc15' };
      return           { cat: 'Obese', note: 'Structured plan is key — you\'ve got this!', pct: (bmi / 40) * 100, col: '#f87171' };
    }

    const activityMultipliers = {
      sedentary: { label: 'Sedentary (desk job)', mult: 1.2 },
      light:     { label: 'Light (1–3×/wk)', mult: 1.375 },
      moderate:  { label: 'Moderate (3–5×/wk)', mult: 1.55 },
      active:    { label: 'Very Active (6–7×/wk)', mult: 1.725 },
      extra:     { label: 'Extra Active (athlete)', mult: 1.9 },
    };

    // ─── GENERATE FITNESS PLAN VIA CLAUDE API ────────────────────────────────
    async function generateFitnessPlan(userData) {
      const prompt = `You are a certified fitness and nutrition coach. Generate a complete, personalized fitness plan for this user.

USER PROFILE:
- Name: ${userData.name || 'User'}
- Age: ${userData.age} years
- Gender: ${userData.gender}
- Weight: ${userData.weightKg} kg
- Height: ${userData.heightCm} cm
- Activity Level: ${userData.activityLevel}
- Goal: ${userData.goal}
- Diet Preference: ${userData.dietPreference || 'non-vegetarian'}

Respond ONLY with a valid JSON object (no markdown, no backticks, no explanation). Use this exact structure:

{
  "dietPlan": {
    "Monday":    { "breakfast": "...", "lunch": "...", "dinner": "...", "snacks": "..." },
    "Tuesday":   { "breakfast": "...", "lunch": "...", "dinner": "...", "snacks": "..." },
    "Wednesday": { "breakfast": "...", "lunch": "...", "dinner": "...", "snacks": "..." },
    "Thursday":  { "breakfast": "...", "lunch": "...", "dinner": "...", "snacks": "..." },
    "Friday":    { "breakfast": "...", "lunch": "...", "dinner": "...", "snacks": "..." },
    "Saturday":  { "breakfast": "...", "lunch": "...", "dinner": "...", "snacks": "..." },
    "Sunday":    { "breakfast": "...", "lunch": "...", "dinner": "...", "snacks": "..." }
  },
  "workoutPlan": [
    {
      "day": "Monday",
      "focus": "...",
      "type": "strength|cardio|rest|hiit",
      "exercises": [
        { "name": "...", "sets": 3, "reps": "10–12", "note": "..." }
      ]
    }
  ],
  "tips": ["...", "...", "..."]
}

Make the diet realistic, varied, and specific to their diet preference and goal. Make the workout plan progressive and achievable for their activity level. Include 1 rest/active-recovery day.`;

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          messages: [{ role: 'user', content: prompt }]
        })
      });

      const data = await response.json();
      const text = data.content.map(b => b.text || '').join('');
      const clean = text.replace(/```json|```/g, '').trim();
      return JSON.parse(clean);
    }

    // ─── RENDER FUNCTIONS ─────────────────────────────────────────────────────
    function renderBMI(u) {
      const bmi = calcBMI(u);
      const info = bmiInfo(bmi);
      document.getElementById('bmiValue').textContent = bmi;
      document.getElementById('bmiCategory').textContent = info.cat;
      document.getElementById('bmiNote').textContent = info.note;
      const marker = document.getElementById('bmiMarker');
      const pct = Math.min(Math.max(info.pct, 2), 97);
      setTimeout(() => { marker.style.left = pct + '%'; marker.style.background = info.col; }, 300);
    }

    function renderBMR(u) {
      const bmr = Math.round(calcBMR(u));
      document.getElementById('bmrValue').textContent = bmr.toLocaleString();
      const act = activityMultipliers[u.activityLevel] || activityMultipliers.moderate;
      const tdee = Math.round(bmr * act.mult);
      const rows = [
        { label: act.label, val: tdee, accent: true },
        { label: 'Fat Loss (−500 kcal)', val: tdee - 500 },
        { label: 'Muscle Gain (+300 kcal)', val: tdee + 300 },
      ];
      document.getElementById('tdeeRows').innerHTML = rows.map(r => `
        <div class="flex justify-between items-center py-1 border-b border-forest-800/60 last:border-0">
          <span class="text-xs font-mono ${r.accent ? 'text-lime-400' : 'text-ash-400'}">${r.label}</span>
          <span class="text-xs font-mono font-semibold ${r.accent ? 'text-lime-300' : 'text-ash-300'}">${r.val.toLocaleString()} kcal</span>
        </div>`).join('');
      document.getElementById('bmrNote').textContent = `Based on Mifflin-St Jeor formula · ${act.label}`;
    }

    const DAYS_SHORT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const DAYS_FULL  = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

    function renderDiet(dietPlan) {
      document.getElementById('dietTableBody').innerHTML = DAYS_FULL.map((day, i) => {
        const d = dietPlan[day] || {};
        return `<tr>
          <td class="px-4 py-3 font-display text-lg text-lime-400 tracking-wider whitespace-nowrap">${DAYS_SHORT[i]}</td>
          <td class="px-4 py-3 text-ash-300 text-xs leading-relaxed">${d.breakfast || '—'}</td>
          <td class="px-4 py-3 text-ash-300 text-xs leading-relaxed">${d.lunch || '—'}</td>
          <td class="px-4 py-3 text-ash-300 text-xs leading-relaxed">${d.dinner || '—'}</td>
          <td class="px-4 py-3 text-ash-400 text-xs leading-relaxed italic">${d.snacks || '—'}</td>
        </tr>`;
      }).join('');
    }

    const typeColors = {
      strength: { bg: 'bg-blue-900/30', border: 'border-blue-700/30', badge: 'bg-blue-900 text-blue-300', icon: '🏋️' },
      cardio:   { bg: 'bg-orange-900/20', border: 'border-orange-700/30', badge: 'bg-orange-900 text-orange-300', icon: '🏃' },
      hiit:     { bg: 'bg-red-900/20', border: 'border-red-700/30', badge: 'bg-red-900 text-red-300', icon: '⚡' },
      rest:     { bg: 'bg-forest-900', border: 'border-forest-700/30', badge: 'bg-forest-800 text-forest-400', icon: '😴' },
    };

    function renderWorkout(workoutPlan) {
      const grid = document.getElementById('workoutGrid');
      grid.innerHTML = workoutPlan.map(day => {
        const tc = typeColors[day.type] || typeColors.rest;
        const exercises = (day.exercises || []).map(ex => `
          <div class="flex items-start gap-2 py-1.5 border-b border-forest-800/40 last:border-0">
            <div class="mt-0.5 w-1.5 h-1.5 rounded-full bg-lime-400 flex-shrink-0"></div>
            <div class="flex-1 min-w-0">
              <p class="text-xs text-ash-300 font-medium leading-tight">${ex.name}</p>
              <p class="text-xs font-mono text-lime-400">${ex.sets} × ${ex.reps}</p>
              ${ex.note ? `<p class="text-xs text-forest-500 italic">${ex.note}</p>` : ''}
            </div>
          </div>`).join('');
        return `
          <div class="${tc.bg} border ${tc.border} rounded-2xl p-4 card-glow transition-all duration-300">
            <div class="flex items-center justify-between mb-3">
              <p class="font-display text-xl text-ash-200 tracking-wider">${day.day}</p>
              <span class="text-lg">${tc.icon}</span>
            </div>
            <div class="flex items-center gap-2 mb-3">
              <span class="px-2 py-0.5 rounded-md text-xs font-mono uppercase tracking-wider ${tc.badge}">${day.type}</span>
              <span class="text-xs text-ash-400 font-mono">${day.focus}</span>
            </div>
            <div class="space-y-0">${exercises || '<p class="text-xs text-forest-500 italic">Active recovery — walk, stretch, foam roll.</p>'}</div>
          </div>`;
      }).join('');
    }

    // ─── MAIN INIT ────────────────────────────────────────────────────────────
    async function init() {
      const user = readUserData();
      if (!user) {
        document.getElementById('loadingMsg').textContent = 'No user data found. Redirecting…';
        setTimeout(() => { window.location.href = '/'; }, 2000);
        return;
      }

      try {
        const plan = await generateFitnessPlan(user);

        // Stop loading
        clearInterval(msgTimer);

        // Populate static info
        document.getElementById('heroName').textContent =
          user.name ? `LET'S GO, ${user.name.split(' ')[0].toUpperCase()}` : 'READY TO CRUSH IT';
        document.getElementById('heroMeta').textContent =
          `${user.age}y · ${user.gender} · ${user.weightKg}kg · ${user.heightCm}cm · Goal: ${user.goal}`;

        renderBMI(user);
        renderBMR(user);
        renderDiet(plan.dietPlan);
        renderWorkout(plan.workoutPlan);

        // Show content
        document.getElementById('loadingScreen').style.opacity = '0';
        document.getElementById('loadingScreen').style.transition = 'opacity 0.5s';
        setTimeout(() => {
          document.getElementById('loadingScreen').style.display = 'none';
          document.getElementById('mainContent').classList.remove('hidden');
        }, 500);

      } catch (err) {
        console.error(err);
        document.getElementById('loadingMsg').textContent = 'Error generating plan. Please try again.';
        document.getElementById('loadingMsg').style.color = '#f87171';
        setTimeout(init, 3000);
      }
    }

    function startOver() {
      localStorage.removeItem('fitforge_user');
      // In a real app: window.location.href = '/onboarding';
      // Demo: reload with fresh demo data after clearing
      location.reload();
    }

    init();
  </script>
</body>
</html>
